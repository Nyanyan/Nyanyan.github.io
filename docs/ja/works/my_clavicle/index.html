<h1>マイ・クラビクル</h1><p>骨折した鎖骨を3Dプリント (2026)</p><p>2026年7月に自転車で転倒し、右鎖骨を骨折しました。マイ・クラビクルは、その時に撮影したCTデータから3Dモデルを作り、3Dプリンタで印刷したものです。右鎖骨が4つほどの骨片に分かれてしまっている様子がよくわかります。折れた部分にヒンジをつけて、整復(ずれた骨を正しい位置に戻すこと)を行えるパズルにもしました。</p><p>2026年8月現在、手術で整復していただき、療養中です。</p><div style="text-align: center"><img src="img/img1.jpg" width="100%"><img src="img/img2.jpg" width="100%"><img src="img/img3.jpg" width="50%"><img src="img/img4.jpg" width="100%"><img src="img/img5.jpg" width="100%"><img src="img/panel.jpg" width="100%"></div></div>
